name: CI

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pip install uv

      - name: Static checks
        run: make static

      - name: Tests
        run: make test

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: python:3.12

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pip install uv

      - name: Build
        run: make build

      - name: Publish
        run: make publish
